.track{position:relative;height:16px;background:var(--bg);border-radius:4px}

.row .n{text-align:right;color:var(--sub);font-size:13px}

.badge{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c)}

th{color:var(--sub);font-weight:500}
tr.tot td{font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.note{font-size:12.5px;color:var(--sub);white-space:pre-line}
.msg{padding:30px;text-align:center;color:var(--sub)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}

.cmp .row{grid-template-columns:64px 1fr 210px}

function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}
    else c+=ch;
  }
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows.map(r=>r.map(s=>s.trim()));
}

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function colChart(labels,series){
  const W=900,H=250,L=44,R=10,T=24,B=30;
  const max=Math.max(1,...series.flatMap(s=>s.vals.map(v=>v||0))),top=Math.ceil(max/20)*20;
  const n=labels.length,gw=(W-L-R)/n,bw=Math.min(24,gw/(series.length+.8));
  let g="";
  for(let k=0;k<=4;k++){const v=top*k/4,y=T+(H-T-B)*(1-v/top);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--sub)">${Math.round(v)}</text>`}
  labels.forEach((lb,i)=>{
    const cx=L+gw*i+gw/2;
    series.forEach((s,j)=>{const v=s.vals[i]||0,h=(H-T-B)*v/top,x=cx-bw*series.length/2+bw*j;
      g+=`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"><title>${esc(lb)} ${esc(s.name)} ${v}</title></rect>`;
      if(v)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-B-h-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--ink)">${v}</text>`;
    });
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--sub)">${esc(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

function parseFixSections(A){
  const out={},isTot=n=>/^(총합계|전체)/.test(n);
  const sec=key=>{
    const i=A.findIndex(r=>r.some(v=>v.includes(key)));if(i<0)return null;
    const c=A[i].findIndex(v=>v.includes(key)),head=(A[i+1]||[]).slice(c).map(x=>x.trim());
    if(head[0]!=="담당자")return null;
    const rows=[];for(let k=i+2;k<A.length&&(A[k][c]||"").trim();k++)rows.push(A[k].slice(c).map(x=>x.trim()));
    return {head,rows};
  };
  let sc=sec("[섹션 5-1]");
  if(sc){const mi=[];sc.head.forEach((h,j)=>{if(/^\d+월$/.test(h))mi.push(j)});
    out.monthly={months:mi.map(j=>sc.head[j]),rows:sc.rows.filter(r=>!isTot(r[0])).map(r=>({name:r[0],v:mi.map(j=>num(r[j])||0)}))}}
  sc=sec("[섹션 5-2]");
  if(sc){const types=sc.head.filter(h=>h!=="담당자"&&h!=="총건수"&&h!=="합계"),ti=sc.head.indexOf("총건수");
    out.types={types,rows:sc.rows.filter(r=>!isTot(r[0])).map(r=>({name:r[0],total:num(r[ti])||0,v:types.map(t=>num(r[sc.head.indexOf(t)])||0)}))}}
  sc=sec("[섹션 5-3]");
  if(sc){
    const gi=(...ns)=>{for(const n of ns){const k=sc.head.indexOf(n);if(k>=0)return k}return -1};
    const g=(r,...ns)=>{const k=gi(...ns);return k<0?0:(num(r[k])||0)};
    const ko=sc.head.findIndex(h=>/기한\s*초과/.test(h));
    out.status={hasOver:ko>=0,rows:sc.rows.filter(r=>!isTot(r[0])).map(r=>({name:r[0],unread:g(r,"미열람"),open:g(r,"시작","진행(시작)"),rest:g(r,"보정 건수","미처리 잔여"),done:g(r,"종료(완료)","종료"),quit:g(r,"사임·폐지"),total:g(r,"전체 건수"),over:ko>=0?(num(r[ko])||0):null}))};
  }
  return out;
}
function extractMain(text){
  const A=parseCSV(text);
  const F=(f,from=0)=>{for(let i=from;i<A.length;i++)if(f(A[i]))return i;return -1};
  const until=(i,c)=>{const o=[];for(;i<A.length&&c(A[i]);i++)o.push(A[i]);return o};
  const out={};
  let h=F(r=>r[0]==="월"&&r[1]==="월 접수 건수");
  if(h>=0){
    const m=until(h+1,r=>/^\d+월$/.test(r[0])).map(r=>({l:r[0],f:num(r[1])||0,s:num(r[2])||0}));
    const kvKeys=["월 신청 소요 기간","평균 개시 소요 기간","평균 보정 횟수","총 사건 처리 소요 기간"];
    out.monthly={m,open:(A[h+1]||[])[5],kv:A.filter(r=>kvKeys.includes(r[0])).map(r=>[r[0],r[1]])};
  }
  h=F(r=>r[0]==="구분"&&r[1]==="한예지");
  if(h>=0){const names=A[h].slice(1).filter(Boolean);
    out.heat={names,rows:until(h+1,r=>/월$/.test(r[0])).map(r=>({l:r[0],v:names.map((_,j)=>num(r[j+1])||0)}))}}
  h=F(r=>r[0]==="담당자"&&r[1]==="25년 전체");
  if(h>=0){const rows=[];for(let i=h+1;i<A.length&&A[i][0];i++){rows.push(A[i].slice(0,14));if(A[i][0].startsWith("합계"))break}
    out.growth={head:A[h].slice(0,14),rows}}
  h=F(r=>r[0]==="건수 (수임월)");
  if(h>=0){const hd=A[h+1],end=hd.indexOf("총계"),rows=[];
    for(let i=h+2;i<A.length&&A[i][0];i++){rows.push(A[i].slice(0,end+1));if(A[i][0]==="총계")break}
    out.counsel={head:hd.slice(0,end+1),rows}}
  h=F(r=>r[0]==="상담자"&&r[1]==="개시");
  if(h>=0){const hd=A[h],end=hd.indexOf("총계"),rows=[];
    for(let i=h+1;i<A.length&&A[i][0];i++){rows.push(A[i].slice(0,end+1));if(A[i][0]==="총계")break}
    out.status={head:hd.slice(0,end+1),rows}}
  const pairList=(label)=>{
    for(let i=0;i<A.length;i++){const j=A[i].findIndex((v,k)=>v==="상담자"&&A[i][k+1]===label);
      if(j>=0){const o=[];for(let k=i+1;k<A.length&&A[k][j]&&A[k][j]!=="상담자";k++)o.push([A[k][j],num(A[k][j+1]),A[k][j+1]]);return o}}
    return [];
  };
  out.openRate=pairList("개시율");out.avgIntake=pairList("월 평균 수임건");
  h=F(r=>r[0]==="법원"&&r[1]==="평균 개시소요기간");
  if(h>=0)out.courts=until(h+1,r=>r[0]).map(r=>({name:r[0],open:num(r[1]),fix:num(r[2]),months:r.slice(3,15).map(v=>num(v)||0),total:num(r[15])||0}));
  h=F(r=>r[0]==="담당자"&&r[1]==="신규 배정");
  if(h>=0)out.cur=until(h+1,r=>r[0]).map(r=>({name:r[0],assign:num(r[1])||0,filed:num(r[2])||0,open:num(r[3])||0,fix:num(r[4])||0}));
  h=F(r=>r[0]==="법원명"&&r[1]==="1월");
  if(h>=0)out.nat=until(h+1,r=>r[0]).map(r=>({name:r[0],total:num(r[13])||0,months:r.slice(1,13).map(v=>num(v)||0)}));
  out.fix=parseFixSections(A);
  return out;
}


function monthInfo(label){            // 이번 달이면 진행 중인 달로 처리
  const mm=/^(\d+)월/.exec(label);if(!mm)return null;
  const t=new Date(),mo=+mm[1];
  if(mo!==t.getMonth()+1)return null;
  return {elapsed:t.getDate(),dim:new Date(t.getFullYear(),mo,0).getDate()};
}

function curMonthLabel(d){
  const t=new Date(),todayL=(t.getMonth()+1)+"월";
  if(!d.heat||!d.cur)return todayL;
  const cands=d.heat.rows.filter(r=>{
    let diff=0,cmp=0;
    d.heat.names.forEach((n,j)=>{const c=d.cur.find(x=>x.name===n);if(c){cmp++;diff+=Math.abs((r.v[j]||0)-c.assign)}});
    return cmp>0&&diff===0;
  });
  if(!cands.length)return todayL;
  if(cands.some(r=>r.l===todayL))return todayL;
  const nz=cands.filter(r=>sum(r.v)>0);
  return nz.length?nz[nz.length-1].l:todayL;
}

  labels.forEach((l,i)=>{g+=`<text x="${sx(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--sub)">${esc(l)}</text>`});
  series.forEach(s=>{

}

function extractWork(text){
  const all=parseCSV(text);
  const h=all.findIndex(r=>r.some((v,j)=>v==="담당자"&&r[j+1]==="배정 건수"));
  if(h<0)throw new Error("업무 부하 표를 찾지 못했습니다");
  const start=all[h].findIndex(v=>v==="담당자"),head=all[h].slice(start),col=n=>head.indexOf(n);
  const people=[];let total=null;
  for(let i=h+1;i<all.length;i++){
    const r=all[i].slice(start),name=r[0];if(!name)break;
    const g=n=>r[col(n)];
    const rec={name,assign:num(g("배정 건수")),filed:num(g("접수 건수")),fileRate:num(g("접수율")),fix:num(g("보정 건수")),open:num(g("개시율")),days:num(g("평균 소요기간")),backlog:num(g("미접수 적체(2개월)")),active:num(g("진행 사건 수")),urgent:num(g("긴급 보정(3일이하)")),load:num(g("종합 체감 부하(%)")),status:g("실질 업무 상태")||""};
    if(name.startsWith("합계")){total=rec;break}
    people.push(rec);
  }
  let note="";for(const r of all)for(const v of r)if(v.includes("종합 체감 부하:")&&v.includes("정의"))note=v;
  // 화면에서 제외할 담당자: 목록에서 빼고, 합계/평균은 남은 인원 기준으로 다시 계산
  const kept=people.filter(p=>!HIDE_NAMES.includes(p.name));
  if(total&&kept.length&&kept.length!==people.length){
    const S=k=>sum(kept.map(p=>p[k])),M=k=>+(S(k)/kept.length).toFixed(1);
    total={...total,assign:S("assign"),filed:S("filed"),fix:S("fix"),backlog:S("backlog"),active:S("active"),urgent:S("urgent"),fileRate:+(S("filed")/S("assign")*100).toFixed(1),open:M("open"),days:M("days"),load:M("load")};
  }
  return {people:kept,total,note};
}

// 먼저 "이 브라우저에서 마지막으로 불러온 데이터"를 바로 보여 주고, 시트 연결이 끝나는 대로 최신 값으로 바꿉니다.
// 처음 접속이라 보관된 데이터가 없으면 파일에 들어 있는 저장본을 임시로 보여 줍니다.
const CACHE_KEY="report-last-data-v1";
function readCache(){try{const o=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");return o&&o.t&&o.at?o:null}catch(e){return null}}
function writeCache(t){try{localStorage.setItem(CACHE_KEY,JSON.stringify({t,at:Date.now()}))}catch(e){}}
const looksLikeCSV=t=>t&&t.length>200&&!/^\s*<(!doctype|html)/i.test(t);
const fmtAt=ms=>new Date(ms).toLocaleString("ko-KR");
const CACHED=readCache();
let STATE=CACHED?{t:CACHED.t,live:false,cached:true,at:CACHED.at}:{t:ALL_SNAPSHOT,live:false};
let PENDING=false;
async function fetchOnce(url,ms){
  // AbortController는 일부 미리보기 환경(iframe)에서 전달되지 못해 쓰지 않고, 제한 시간은 Promise.race로 처리합니다.
  const run=(async()=>{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.fatal=true;throw e}
    return await r.text();
  })();
  run.catch(()=>{});
  const timeout=new Promise((_,rej)=>setTimeout(()=>{const e=new Error("시간 초과");e.name="AbortError";rej(e)},ms));
  return Promise.race([run,timeout]);
}
async function get(url,snap){
  let last;
  for(let i=0;i<2;i++){             // 시간 초과·네트워크 오류는 한 번 더 시도
    try{
      const t=await fetchOnce(url,20000);
      if(!looksLikeCSV(t)){const e=new Error("시트 응답이 올바르지 않습니다");e.fatal=true;throw e}
      writeCache(t);
      return {t,live:true,at:Date.now()};
    }catch(e){last=e;if(e.fatal)break}
  }
  const c=readCache(),err=last&&last.name==="AbortError"?"시간 초과":(last&&last.message)||"알 수 없음";
  return c?{t:c.t,live:false,cached:true,at:c.at,err}:{t:snap,live:false,err};
}

const fmt1=(v,d)=>v==null?"-":(d?v.toFixed(d):int(v));

function gauge(load){
  const segs=[["여유",40,"var(--s-여유)","~80%"],["적정",15,"var(--s-적정)","80~110%"],["과중",10,"var(--s-과중)","110~130%"],["심각",35,"var(--s-심각)","130%~"]];

function rankBlock(name,defs){
  return defs.map(([label,arr,desc,tail,u,dec])=>{
    const a=arr.filter(x=>x.v!=null).sort((x,y)=>desc?y.v-x.v:x.v-y.v);
    const k=a.findIndex(x=>x.name===name);
    if(k<0||a.length<2)return "";
    const mx=Math.max(...a.map(x=>x.v),1);
    return `<div class="pos"><div class="pl"><b>${label}</b><span>${a.length}명 중 ${k+1}위 (${tail})</span></div><div class="mini">${a.map(x=>`<i class="${x.name===name?"me":""}" style="height:${Math.max(4,x.v/mx*100).toFixed(1)}%" title="${x.name===name?esc(name)+" ":""}${fmt1(x.v,dec)}${u}"></i>`).join("")}</div></div>`;

  if(M.heat)M.heat.names.forEach((n,j)=>{if(M.heat.rows.some(r=>r.v[j]>0)||keep(n))set.add(n)});

}

    ?(STATE.live?"갱신 중…":STATE.cached?"연결 중… (이 브라우저에서 마지막으로 불러온 데이터 "+fmtAt(STATE.at)+" 기준을 표시 중)":"연결 중… (저장본을 임시로 표시)")
    :STATE.live?"실시간 ("+fmtAt(STATE.at)+" 기준)"
    :STATE.cached?"마지막으로 불러온 데이터("+fmtAt(STATE.at)+" 기준 · 연결 오류: "+STATE.err+")"
    :"저장본("+SNAP_DATE+" 기준 · 연결 오류: "+STATE.err+")";
  meta.textContent="데이터: "+lab+(!PENDING&&!STATE.live?" — 연결하지 못해 이전 값을 표시 중이며, 시트가 바뀌어도 갱신되지 않습니다.":"");
}
function load(){
  PENDING=true;paint();
  get(CONFIG.url,ALL_SNAPSHOT).then(r=>{STATE=r;PENDING=false;paint()});
}
window.addEventListener("hashchange",()=>{CURNAME=null;paint()});
document.getElementById("reload").onclick=load;
load();
</script>
</body>
</html>
