<html lang="ko">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#17212e;--sub:#657386;--line:#e1e6ed;--acc:#2456a6;--acc2:#2f9a7a;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1160px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.meta{color:var(--sub);font-size:13px;max-width:720px}
h2{font-size:18px;margin:34px 0 10px}
h3{font-size:14px;margin:0 0 8px}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.bars .row{display:grid;grid-template-columns:64px 1fr 130px;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.track{position:relative;height:16px;background:var(--bg);border-radius:4px}
.fill{height:100%;border-radius:4px;background:var(--c,var(--acc))}
.ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.row .n{text-align:right;color:var(--sub);font-size:13px}
.legend{font-size:12px;color:var(--sub);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{color:var(--sub);font-weight:500}
tr.tot td{font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.note{font-size:12.5px;color:var(--sub);white-space:pre-line}
.msg{padding:30px;text-align:center;color:var(--sub)}
svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.chip[aria-pressed=false]{opacity:.55}
.cmp .row{grid-template-columns:64px 1fr 210px}
.gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.g{--t:color-mix(in srgb,var(--h) 9%,var(--card));--t2:color-mix(in srgb,var(--h) 19%,var(--card));background:var(--t);border-right:2px solid var(--h);display:flex;flex-direction:column}
.g:last-child{border-right:0}
.gh{background:var(--h);color:#fff;font-weight:700;font-size:15px;text-align:center;padding:10px 6px}
.gc{color:var(--f);font-weight:700;font-size:30px;text-align:center;padding:10px 0 12px}
.gt{flex:1 1 auto;width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
.gt th,.gt td{padding:6px 5px;text-align:center;border:1px solid var(--line);height:30px}
.gt th{background:var(--t2);color:var(--f);font-weight:700}
.gt td:first-child{text-align:left;font-weight:500}
.gt td.ld{text-align:right;font-weight:700}
.gt th:first-child,.gt td:first-child{position:static;background:inherit}
.gt td:first-child{background:var(--card)}
.gs{display:grid;grid-template-columns:1fr 1fr;font-size:12px;border-top:1px solid var(--line);background:var(--t)}
.gs span,.gs b{padding:7px 6px;text-align:center}
.gs span{font-weight:500;border-right:1px solid var(--line)}
.ga{margin-top:auto;border-top:1px solid var(--line);color:var(--f);font-weight:700;font-size:12px;text-align:center;padding:10px 6px;background:var(--t)}
.gnote{margin-top:10px;background:color-mix(in srgb,var(--ink) 7%,var(--card));border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:12.5px;line-height:1.75;white-space:pre-line;color:var(--f-심각)}
.sb{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.sc.top{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sh{display:flex;align-items:center;gap:8px}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--bg);color:var(--sub);font-size:12px;font-weight:700}
.sc.top .rk{background:var(--acc);color:var(--card)}
.nm{font-weight:700;font-size:16px}
.tag{margin-left:auto;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.big small{font-size:14px;font-weight:500;color:var(--sub);margin-left:3px}
.trk{height:6px;background:var(--bg);border-radius:3px;margin-top:4px}
.fl{height:100%;background:var(--acc);border-radius:3px}
.share{font-size:12px;color:var(--sub);margin-bottom:6px}
.st{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--line);padding:5px 0}
.st span{color:var(--sub)}
.st b.slow{color:var(--down)}.st b.fast{color:var(--up)}

.crow .n{text-align:right;color:var(--sub);font-size:13px}

const RULE={심각:"부하 130% 이상",과중:"부하 110%~130%",적정:"부하 80%~110%",여유:"부하 80% 미만"};
const ACTION={심각:"신규 배정 즉시 중단 및 보정 업무 긴급 지원",과중:"업무량 실시간 모니터링 및 추가 배정 억제",적정:"표준 업무 사이클 및 현재 배정 비율 유지",여유:"신규 사건 우선 배정 및 보정 이관 수용"};
function parseCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}
    else c+=ch;
  }
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows.map(r=>r.map(s=>s.trim()));
}
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[,%+\s]/g,""));return isNaN(n)?null:n};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const int=n=>n==null?"-":Math.round(n).toLocaleString("ko-KR");
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const kpi=(k,v)=>`<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;
const sign=s=>/^\+|▲/.test(s)?"up":/^-\d|▼/.test(s)?"down":"flat";
const bar=(label,val,max,right,color)=>`<div class="row" ${color?`style="--c:${color}"`:""}><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${max?Math.min(100,val/max*100).toFixed(1):0}%"></div></div><span class="n">${right}</span></div>`;
const heat=(v,max)=>v?`style="background:color-mix(in srgb,var(--acc) ${Math.round(v/max*55)}%,transparent)"`:"";
const table=(head,rows,totalLast)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;

function colChart(labels,series){
  const W=900,H=250,L=44,R=10,T=24,B=30;
  const max=Math.max(1,...series.flatMap(s=>s.vals.map(v=>v||0))),top=Math.ceil(max/20)*20;
  const n=labels.length,gw=(W-L-R)/n,bw=Math.min(24,gw/(series.length+.8));
  let g="";
  for(let k=0;k<=4;k++){const v=top*k/4,y=T+(H-T-B)*(1-v/top);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--sub)">${Math.round(v)}</text>`}
  labels.forEach((lb,i)=>{
    const cx=L+gw*i+gw/2;
    series.forEach((s,j)=>{const v=s.vals[i]||0,h=(H-T-B)*v/top,x=cx-bw*series.length/2+bw*j;
      g+=`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"><title>${esc(lb)} ${esc(s.name)} ${v}</title></rect>`;
      if(v)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-B-h-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--ink)">${v}</text>`;
    });
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--sub)">${esc(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

/* ===== 통합 데이터 탭 해석 ===== */
function extractMain(text){
  const A=parseCSV(text);
  const F=(f,from=0)=>{for(let i=from;i<A.length;i++)if(f(A[i]))return i;return -1};
  const until=(i,c)=>{const o=[];for(;i<A.length&&c(A[i]);i++)o.push(A[i]);return o};
  const out={};
  let h=F(r=>r[0]==="월"&&r[1]==="월 접수 건수");
  if(h>=0){
    const m=until(h+1,r=>/^\d+월$/.test(r[0])).map(r=>({l:r[0],f:num(r[1])||0,s:num(r[2])||0}));
    const kvKeys=["월 신청 소요 기간","평균 개시 소요 기간","평균 보정 횟수","총 사건 처리 소요 기간"];
    out.monthly={m,open:(A[h+1]||[])[5],kv:A.filter(r=>kvKeys.includes(r[0])).map(r=>[r[0],r[1]])};
  }
  h=F(r=>r[0]==="구분"&&r[1]==="한예지");
  if(h>=0){const names=A[h].slice(1).filter(Boolean);
    out.heat={names,rows:until(h+1,r=>/월$/.test(r[0])).map(r=>({l:r[0],v:names.map((_,j)=>num(r[j+1])||0)}))}}
  h=F(r=>r[0]==="담당자"&&r[1]==="25년 전체");
  if(h>=0){const rows=[];for(let i=h+1;i<A.length&&A[i][0];i++){rows.push(A[i].slice(0,14));if(A[i][0].startsWith("합계"))break}
    out.growth={head:A[h].slice(0,14),rows}}
  h=F(r=>r[0]==="건수 (수임월)");
  if(h>=0){const hd=A[h+1],end=hd.indexOf("총계"),rows=[];
    for(let i=h+2;i<A.length&&A[i][0];i++){rows.push(A[i].slice(0,end+1));if(A[i][0]==="총계")break}
    out.counsel={head:hd.slice(0,end+1),rows}}
  h=F(r=>r[0]==="상담자"&&r[1]==="개시");
  if(h>=0){const hd=A[h],end=hd.indexOf("총계"),rows=[];
    for(let i=h+1;i<A.length&&A[i][0];i++){rows.push(A[i].slice(0,end+1));if(A[i][0]==="총계")break}
    out.status={head:hd.slice(0,end+1),rows}}
  const pairList=(label)=>{
    for(let i=0;i<A.length;i++){const j=A[i].findIndex((v,k)=>v==="상담자"&&A[i][k+1]===label);
      if(j>=0){const o=[];for(let k=i+1;k<A.length&&A[k][j]&&A[k][j]!=="상담자";k++)o.push([A[k][j],num(A[k][j+1]),A[k][j+1]]);return o}}
    return [];
  };
  out.openRate=pairList("개시율");out.avgIntake=pairList("월 평균 수임건");
  h=F(r=>r[0]==="법원"&&r[1]==="평균 개시소요기간");
  if(h>=0)out.courts=until(h+1,r=>r[0]).map(r=>({name:r[0],open:num(r[1]),fix:num(r[2]),months:r.slice(3,15).map(v=>num(v)||0),total:num(r[15])||0}));
  h=F(r=>r[0]==="담당자"&&r[1]==="신규 배정");
  if(h>=0)out.cur=until(h+1,r=>r[0]).map(r=>({name:r[0],assign:num(r[1])||0,filed:num(r[2])||0,open:num(r[3])||0,fix:num(r[4])||0}));
  h=F(r=>r[0]==="법원명"&&r[1]==="1월");
  if(h>=0)out.nat=until(h+1,r=>r[0]).map(r=>({name:r[0],total:num(r[13])||0,months:r.slice(1,13).map(v=>num(v)||0)}));
  return out;
}

function acChart(people){
  const ac=[...people].sort((a,b)=>(b.assign||0)-(a.assign||0));
  return `<h2>담당자별 배정/접수 건수</h2><div class="panel">${colChart(ac.map(p=>p.name),[{name:"배정",vals:ac.map(p=>p.assign||0),color:"var(--acc)"},{name:"접수",vals:ac.map(p=>p.filed||0),color:"var(--acc2)"}])}<div class="legend"><span>2026년 누적 기준이며, 배정 건수가 많은 순서입니다.</span></div></div>`;
}
/* ===== 이번 달 담당자별 배정·접수 현황 ===== */
// 시트의 '신규 배정' 표가 어느 달 값인지, 월별 배정표와 대조해서 찾습니다(달이 바뀌어도 시트 값에 맞춰 자동으로 바뀜).
function curMonthLabel(d){
  const t=new Date(),todayL=(t.getMonth()+1)+"월";
  if(!d.heat||!d.cur)return todayL;
  const cands=d.heat.rows.filter(r=>{
    let diff=0,cmp=0;
    d.heat.names.forEach((n,j)=>{const c=d.cur.find(x=>x.name===n);if(c){cmp++;diff+=Math.abs((r.v[j]||0)-c.assign)}});
    return cmp>0&&diff===0;
  });
  if(!cands.length)return todayL;
  if(cands.some(r=>r.l===todayL))return todayL;
  const nz=cands.filter(r=>sum(r.v)>0);
  return nz.length?nz[nz.length-1].l:todayL;
}
function curMonthChart(d){
  if(!d.cur)return "";
  const lab=curMonthLabel(d);
  const rows=d.cur.filter(r=>!HIDE_NAMES.includes(r.name)&&(r.assign||r.filed)).sort((a,b)=>b.assign-a.assign);
  if(!rows.length)return `<h2>${esc(lab)} 담당자별 배정·접수 현황</h2><div class="panel"><div class="msg">아직 ${esc(lab)}에 집계된 배정·접수 건이 없습니다.</div></div>`;
  const tA=sum(rows.map(r=>r.assign)),tF=sum(rows.map(r=>r.filed));
  return `<h2>${esc(lab)} 담당자별 배정·접수 현황</h2><div class="kpis">${kpi(lab+" 신규 배정",int(tA)+"건")}${kpi(lab+" 접수 완료",int(tF)+"건")}${kpi("접수 ÷ 배정",tA?(tF/tA*100).toFixed(0)+"%":"-")}</div>
  <div class="panel">${colChart(rows.map(r=>r.name),[{name:"신규 배정",vals:rows.map(r=>r.assign),color:"var(--acc)"},{name:"접수 완료",vals:rows.map(r=>r.filed),color:"var(--acc2)"}])}<div class="legend"><span>시트의 담당자별 신규 배정·접수 완료 표 기준이며, 배정이 많은 순서입니다. 달이 바뀌면 시트 값에 맞춰 월 이름도 바뀝니다.</span></div></div>`;
}

/* ===== 전국 법원 통계와 kj 비교 ===== */
function natChart(labels,nat,kj,share){
  const W=900,H=320,L=62,R=56,T=30,B=52,n=labels.length,gw=(W-L-R)/n,bw=Math.min(44,gw*.55);
  const nmax=Math.ceil(Math.max(...nat)/5000)*5000||5000,kmax=Math.max(20,Math.ceil(Math.max(...kj)/20)*20);
  const sy=v=>T+(H-T-B)*(1-v/nmax),sy2=v=>T+(H-T-B)*(1-v/kmax),cx=i=>L+gw*i+gw/2;
  let g="";
  for(let k=0;k<=4;k++){const y=T+(H-T-B)*(1-k/4);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--acc)">${int(nmax*k/4)}</text><text x="${W-R+6}" y="${y+4}" font-size="12" fill="var(--acc2)">${int(kmax*k/4)}</text>`}
  g+=`<text x="${L-6}" y="${T-14}" text-anchor="end" font-size="11" fill="var(--acc)">전국</text><text x="${W-R+6}" y="${T-14}" font-size="11" fill="var(--acc2)">kj</text>`;
  nat.forEach((v,i)=>{const y=sy(v);
    g+=`<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-B-y).toFixed(1)}" rx="3" fill="var(--acc)" opacity=".5"><title>${esc(labels[i])} 전국 접수 ${int(v)}건</title></rect>`;
    g+=`<text x="${cx(i).toFixed(1)}" y="${(H-B-6).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--ink)">${int(v)}</text>`;
    g+=`<text x="${cx(i)}" y="${H-B+17}" text-anchor="middle" font-size="12" fill="var(--sub)">${esc(labels[i])}</text>`;
    g+=`<text x="${cx(i)}" y="${H-B+34}" text-anchor="middle" font-size="11" fill="var(--acc2)">${share[i].toFixed(2)}%</text>`});
  const pts=kj.map((v,i)=>[cx(i),sy2(v)]);
  g+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--acc2)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--acc2)"><title>${esc(labels[i])} kj 접수 ${int(kj[i])}건 (전국 대비 ${share[i].toFixed(2)}%)</title></circle><text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--acc2)">${int(kj[i])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 전국 접수와 kj 접수">${g}</svg>`;
}
function natCompare(d){
  if(!d.courts||!d.nat||!d.nat.length)return "";
  const nm=Object.fromEntries(d.nat.map(n=>[n.name,n]));
  const natM=Array.from({length:12},(_,i)=>sum(d.nat.map(n=>n.months[i]||0)));
  const avail=natM.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
  if(!avail.length)return "";
  const kjc=d.courts.filter(c=>nm[c.name]);
  const labels=avail.map(i=>(i+1)+"월"),natV=avail.map(i=>natM[i]),kjV=avail.map(i=>sum(kjc.map(c=>c.months[i]||0)));
  const share=natV.map((v,k)=>v?kjV[k]/v*100:0),NT=sum(natV),KT=sum(kjV);
  const range=labels[0]+"~"+labels[labels.length-1];
  const rows=kjc.map(c=>{const n=nm[c.name],nat=sum(avail.map(i=>n.months[i]||0)),kj=sum(avail.map(i=>c.months[i]||0));return {name:c.name,nat,kj,sh:nat?kj/nat*100:0}})
    .filter(r=>r.kj>0&&r.nat>0).sort((a,b)=>b.sh-a.sh);
  const mx=Math.max(0.01,...rows.map(r=>r.sh)),mk=Math.max(1,...rows.map(r=>r.kj));
  return `<h2>전국 법원 통계와 kj 비교 <small class="flat" style="font-weight:400;font-size:13px">· ${range}</small></h2>
  <div class="kpis">${kpi("전국 접수 ("+range+")",int(NT)+"건")}${kpi("kj 접수 (같은 기간)",int(KT)+"건")}${kpi("kj 전국 점유율",NT?(KT/NT*100).toFixed(2)+"%":"-")}${rows[0]?kpi("점유율 최고 법원",esc(rows[0].name)+" "+rows[0].sh.toFixed(2)+"%"):""}</div>
  <div class="panel"><h3>월별 전국 접수와 kj 접수</h3>${natChart(labels,natV,kjV,share)}<div class="legend"><span><i style="background:var(--acc);opacity:.5"></i>전국 접수 건수(왼쪽 축)</span><span><i style="background:var(--acc2)"></i>kj 접수 건수(오른쪽 축)</span><span>월 아래 초록 숫자: kj 점유율(kj ÷ 전국)</span></div></div>
  <div class="panel" style="margin-top:10px"><h3>법원별 kj 점유율과 접수 건수</h3>${rows.map(r=>`<div class="crow"><span>${esc(r.name)}</span><div><div class="track"><div class="fill" style="width:${(r.sh/mx*100).toFixed(1)}%;background:var(--acc2)"></div></div><div class="track" style="margin-top:3px"><div class="fill" style="width:${(r.kj/mk*100).toFixed(1)}%;background:var(--acc)"></div></div></div><span class="n">${r.sh.toFixed(2)}% · kj ${int(r.kj)} / 전국 ${int(r.nat)}</span></div>`).join("")}<div class="legend"><span><i style="background:var(--acc2)"></i>kj 점유율(위)</span><span><i style="background:var(--acc)"></i>kj 접수 건수(아래)</span><span>전국 통계가 있는 달(${range})만 비교했으며, 접수가 적은 법원은 점유율이 한두 건에 크게 달라질 수 있습니다.</span></div></div>`;
}

/* ===== 월별 실적 추이 ===== */
function monthInfo(label){            // 이번 달이면 진행 중인 달로 처리
  const mm=/^(\d+)월/.exec(label);if(!mm)return null;
  const t=new Date(),mo=+mm[1];
  if(mo!==t.getMonth()+1)return null;
  return {elapsed:t.getDate(),dim:new Date(t.getFullYear(),mo,0).getDate()};
}
const pctChg=(a,b)=>b?(a-b)/b*100:null;
const chgTxt=v=>v==null?"":(v>=0?"▲":"▼")+Math.abs(v).toFixed(0)+"%";
function monthChart(m,inf,avgF,avgS){
  const W=900,H=300,L=44,R=86,T=26,B=66,n=m.length,last=m[n-1];
  const showProj=inf&&inf.elapsed>=7;
  const proj=showProj?{f:Math.round(last.f/inf.elapsed*inf.dim),s:Math.round(last.s/inf.elapsed*inf.dim)}:null;
  const max=Math.max(1,...m.flatMap(x=>[x.f,x.s]),...(proj?[proj.f,proj.s]:[]),avgF||0,avgS||0),top=Math.ceil(max/20)*20;
  const gw=(W-L-R)/n,bw=Math.min(24,gw/2.8),sy=v=>T+(H-T-B)*(1-v/top);
  const ser=[["f","접수","var(--acc)"],["s","수임","var(--acc2)"]];
  let g="";
  for(let k=0;k<=4;k++){const v=top*k/4,y=sy(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--sub)">${Math.round(v)}</text>`}
  m.forEach((x,i)=>{
    const cx=L+gw*i+gw/2,cur=inf&&i===n-1;
    ser.forEach(([k,name,color],j)=>{
      const v=x[k],h=(H-T-B)*v/top,bx=cx-bw+bw*j;
      g+=`<rect x="${bx.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}" ${cur?'fill-opacity=".4" stroke="'+color+'" stroke-dasharray="3 2"':""}><title>${esc(x.l)} ${name} ${v}건${cur?" (진행 중)":""}</title></rect>`;
      if(v)g+=`<text x="${(bx+bw/2).toFixed(1)}" y="${(H-B-h-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--ink)">${v}</text>`;
      if(cur&&proj){const pv=proj[k],py=sy(pv);
        g+=`<rect x="${bx.toFixed(1)}" y="${py.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-B-py).toFixed(1)}" rx="2" fill="none" stroke="${color}" stroke-dasharray="4 3"><title>${esc(x.l)} ${name} 예상 ${pv}건 (경과 ${inf.elapsed}/${inf.dim}일 기준)</title></rect>`;
      }
    });
    if(cur&&proj){g+=`<text x="${cx}" y="${(sy(Math.max(proj.f,proj.s))-6).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--sub)">예상 ${proj.f} · ${proj.s}</text>`}
    g+=`<text x="${cx}" y="${H-B+16}" text-anchor="middle" font-size="12" fill="var(--sub)">${esc(x.l)}${cur?"*":""}</text>`;
    if(i>0)ser.forEach(([k,,color],j)=>{const c=pctChg(x[k],m[i-1][k]);
      g+=`<text x="${cx}" y="${H-B+32+j*14}" text-anchor="middle" font-size="11" fill="${color}" opacity="${cur?.6:1}">${chgTxt(c)}</text>`});
  });
  // 완료된 달 평균 기준선 (두 선이 가까우면 글자 위치를 벌림)
  const lines=[[avgF,"접수","var(--acc)"],[avgS,"수임","var(--acc2)"]].filter(l=>l[0]!=null);
  let prevY=-99;

function monthlyHTML(M){
  const m=M.m.filter(x=>x.f||x.s);if(!m.length)return "";
  const inf=monthInfo(m[m.length-1].l),done=inf?m.slice(0,-1):m;

  const chg=(a,b)=>{const c=pctChg(a,b);return c==null?"":`<span class="${c>=0?"up":"down"}">${chgTxt(c)}</span> ${esc(prev.l)} 대비`};
  const pr=inf&&inf.elapsed>=7?{f:Math.round(cur.f/inf.elapsed*inf.dim),s:Math.round(cur.s/inf.elapsed*inf.dim)}:null;
  const sub=k=>{const c=prev?chg(cur[k],prev[k]):"";
    if(!pr||!prev)return c;

    return c+`<br>월말 예상 ${pr[k]}건 (<span class="${pc>=0?"up":"down"}">${chgTxt(pc)}</span>)`};
  const tag=inf?" (진행 중)":"";
  let cards=card(esc(cur.l)+" 접수"+tag,int(cur.f)+"건",sub("f"))+card(esc(cur.l)+" 수임"+tag,int(cur.s)+"건",sub("s"))
    +card("접수 건수(누적)",int(F),m.length+"개월")+card("수임 건수(누적)",int(S),"");
  if(avgF!=null)cards+=card("월평균 접수 · 수임",int(avgF)+" · "+int(avgS),esc(done[0].l)+"~"+esc(dl.l)+" 완료된 달 평균");

  const dur=M.kv.filter(([k])=>/기간/.test(k)).map(([k,v])=>[k,parseFloat(String(v).replace(/,/g,""))]).filter(x=>!isNaN(x[1]));

  return `<h2>월별 실적 추이</h2><div class="kpis">${cards}</div>

}

/* ===== 담당자별 월별 배정 추이 (선 그래프) ===== */
const PALETTE=["#2456a6","#d9531e","#2f9a7a","#8a4fd0","#c9a100","#d03f7a","#4a90c4","#7a8a00","#a0522d","#008b8b","#6b6bd1","#d2691e","#5f7f5f"];
let TREND=null;
function lineChart(labels,series){
  const W=900,H=280,L=40,R=14,T=12,B=30;
  const max=Math.max(5,...series.flatMap(s=>s.vals)),top=Math.ceil(max/5)*5,n=labels.length;
  const sx=i=>L+(W-L-R)*(n>1?i/(n-1):.5),sy=v=>T+(H-T-B)*(1-v/top);
  let g="";
  for(let k=0;k<=5;k++){const v=top*k/5,y=sy(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--sub)">${Math.round(v)}</text>`}
  labels.forEach((l,i)=>{g+=`<text x="${sx(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--sub)">${esc(l)}</text>`});
  series.forEach(s=>{
    const d=s.vals.map((v,i)=>(i?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?2:2.5}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`;
    if(!s.dash)s.vals.forEach((v,i)=>{g+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${s.color}"><title>${esc(s.name)} ${esc(labels[i])}: ${v}건</title></circle>`});
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="담당자별 월별 배정 추이">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
const TREND_HIDE=HIDE_NAMES;
function initTrend(h){
  const idx=h.names.map((n,j)=>j).filter(j=>!TREND_HIDE.includes(h.names[j]));
  const rows=h.rows.filter(r=>sum(idx.map(j=>r.v[j]))>0);
  const totals=Object.fromEntries(idx.map(j=>[j,sum(rows.map(r=>r.v[j]))]));
  const top3=[...idx].sort((a,b)=>totals[b]-totals[a]).slice(0,3);

function drawTrend(){

/* ===== 법원별 접수·소요기간 스코어보드 ===== */
function courtBoard(d){
  if(!d.courts)return "";
  const natMap=Object.fromEntries((d.nat||[]).map(n=>[n.name,n.total]));
  const cs=d.courts.filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  if(!cs.length)return "";
  const all=sum(cs.map(c=>c.total));
  const wavg=k=>{const v=cs.filter(c=>c[k]!=null&&c[k]>0);const w=sum(v.map(c=>c.total));return w?sum(v.map(c=>c[k]*c.total))/w:null};
  const aO=wavg("open"),aF=wavg("fix");
  const stat=(label,v,avg)=>{
    if(v==null||!v)return `<div class="st"><span>${label}</span><b class="flat">-</b></div>`;
    const diff=avg==null?null:Math.round(v-avg),cls=diff==null?"flat":diff>0?"slow":"fast";
    return `<div class="st"><span>${label}</span><b class="${cls}">${v.toFixed(1)}일${diff==null||diff===0?"":` <small>${diff>0?"▲":"▼"}${Math.abs(diff)}</small>`}</b></div>`;
  };
  const mx=cs[0].total;
  const cards=cs.map((c,i)=>{
    const part=sum(c.months.slice(0,8)),nat=natMap[c.name],sh=nat?(part/nat*100).toFixed(2)+"%":"-";
    return `<div class="sc${i<3?" top":""}"><div class="sh"><span class="rk">${i+1}</span><span class="nm">${esc(c.name)}</span>${c.total<10?'<span class="tag">접수 적음</span>':""}</div>
    <div class="big">${int(c.total)}<small>건</small></div>
    <div class="trk" title="당사 전체 접수의 ${(c.total/all*100).toFixed(1)}%"><div class="fl" style="width:${(c.total/mx*100).toFixed(1)}%"></div></div>
    <div class="share">당사 접수의 ${(c.total/all*100).toFixed(1)}%</div>
    ${stat("평균 개시 소요",c.open,aO)}${stat("평균 보정 소요",c.fix,aF)}
    <div class="st"><span>전국 대비(1~8월)</span><b>${sh}</b></div></div>`;
  }).join("");
  return `<h2>법원별 접수 현황과 소요기간</h2>
  <div class="kpis">${kpi("총 접수 건수",int(all))}${kpi("접수 법원",cs.length+"곳")}${kpi("평균 개시 소요",aO==null?"-":aO.toFixed(1)+"일")}${kpi("평균 보정 소요",aF==null?"-":aF.toFixed(1)+"일")}</div>
  <div class="sb">${cards}</div>
  <div class="legend" style="margin-top:8px"><span class="up">▼ 평균보다 짧음</span><span class="down">▲ 평균보다 긺</span><span>평균은 법원별 접수 건수로 가중한 값입니다. 접수가 10건 미만인 법원은 평균이 한두 건에 좌우될 수 있습니다. 전국 대비는 당사 1~8월 접수 ÷ 전국 접수(1~8월)입니다.</span></div>`;
}

/* ===== 업무 부하 탭 해석 ===== */
function extractWork(text){
  const all=parseCSV(text);
  const h=all.findIndex(r=>r.some((v,j)=>v==="담당자"&&r[j+1]==="배정 건수"));
  if(h<0)throw new Error("업무 부하 표를 찾지 못했습니다");
  const start=all[h].findIndex(v=>v==="담당자"),head=all[h].slice(start),col=n=>head.indexOf(n);
  const people=[];let total=null;
  for(let i=h+1;i<all.length;i++){
    const r=all[i].slice(start),name=r[0];if(!name)break;
    const g=n=>r[col(n)];
    const rec={name,assign:num(g("배정 건수")),filed:num(g("접수 건수")),fileRate:num(g("접수율")),fix:num(g("보정 건수")),open:num(g("개시율")),days:num(g("평균 소요기간")),backlog:num(g("미접수 적체(2개월)")),active:num(g("진행 사건 수")),urgent:num(g("긴급 보정(3일이하)")),load:num(g("종합 체감 부하(%)")),status:g("실질 업무 상태")||""};
    if(name.startsWith("합계")){total=rec;break}
    people.push(rec);
  }
  let note="";for(const r of all)for(const v of r)if(v.includes("종합 체감 부하:")&&v.includes("정의"))note=v;
  // 화면에서 제외할 담당자: 목록에서 빼고, 합계/평균은 남은 인원 기준으로 다시 계산
  const kept=people.filter(p=>!HIDE_NAMES.includes(p.name));
  if(total&&kept.length&&kept.length!==people.length){
    const S=k=>sum(kept.map(p=>p[k])),M=k=>+(S(k)/kept.length).toFixed(1);
    total={...total,assign:S("assign"),filed:S("filed"),fix:S("fix"),backlog:S("backlog"),active:S("active"),urgent:S("urgent"),fileRate:+(S("filed")/S("assign")*100).toFixed(1),open:M("open"),days:M("days"),load:M("load")};
  }
  return {people:kept,total,note};
}

// 먼저 "이 브라우저에서 마지막으로 불러온 데이터"를 바로 보여 주고, 시트 연결이 끝나는 대로 최신 값으로 바꿉니다.
// 처음 접속이라 보관된 데이터가 없으면 파일에 들어 있는 저장본을 임시로 보여 줍니다.
const CACHE_KEY="report-last-data-v1";
function readCache(){try{const o=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");return o&&o.t&&o.at?o:null}catch(e){return null}}
function writeCache(t){try{localStorage.setItem(CACHE_KEY,JSON.stringify({t,at:Date.now()}))}catch(e){}}
const looksLikeCSV=t=>t&&t.length>200&&!/^\s*<(!doctype|html)/i.test(t);
const fmtAt=ms=>new Date(ms).toLocaleString("ko-KR");
const CACHED=readCache();
let STATE=CACHED?{t:CACHED.t,live:false,cached:true,at:CACHED.at}:{t:ALL_SNAPSHOT,live:false};
let PENDING=false;
async function fetchOnce(url,ms){
  // AbortController는 일부 미리보기 환경(iframe)에서 전달되지 못해 쓰지 않고, 제한 시간은 Promise.race로 처리합니다.
  const run=(async()=>{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok){const e=new Error("HTTP "+r.status);e.fatal=true;throw e}
    return await r.text();
  })();
  run.catch(()=>{});
  const timeout=new Promise((_,rej)=>setTimeout(()=>{const e=new Error("시간 초과");e.name="AbortError";rej(e)},ms));
  return Promise.race([run,timeout]);
}
async function get(url,snap){
  let last;
  for(let i=0;i<2;i++){             // 시간 초과·네트워크 오류는 한 번 더 시도
    try{
      const t=await fetchOnce(url,20000);
      if(!looksLikeCSV(t)){const e=new Error("시트 응답이 올바르지 않습니다");e.fatal=true;throw e}
      writeCache(t);
      return {t,live:true,at:Date.now()};
    }catch(e){last=e;if(e.fatal)break}
  }
  const c=readCache(),err=last&&last.name==="AbortError"?"시간 초과":(last&&last.message)||"알 수 없음";
  return c?{t:c.t,live:false,cached:true,at:c.at,err}:{t:snap,live:false,err};
}
function paint(){
  const app=document.getElementById("app"),meta=document.getElementById("meta");
  let html="",D=null,W=null,werr=null;
  try{W=extractWork(STATE.t)}catch(e){werr=e}
  try{D=extractMain(STATE.t);html+=mainHTML(D,W)}catch(e){html+='<div class="msg">월별 실적을 표시하지 못했습니다: '+esc(e.message)+'</div>'}
  try{if(werr)throw werr;html+=workHTML(W,STATE.live?"":(STATE.cached?"마지막 데이터("+fmtAt(STATE.at)+" 기준)":"저장본("+SNAP_DATE+" 기준)"))}catch(e){html+='<div class="msg">업무 부하를 표시하지 못했습니다: '+esc(e.message)+'</div>'}
  try{html+=mainHTML2(D||extractMain(STATE.t))}catch(e){html+='<div class="msg">상세 현황을 표시하지 못했습니다: '+esc(e.message)+'</div>'}
  app.innerHTML=html;
  if(D&&D.heat)initTrend(D.heat);
  const lab=PENDING
    ?(STATE.live?"갱신 중…":STATE.cached?"연결 중… (이 브라우저에서 마지막으로 불러온 데이터 "+fmtAt(STATE.at)+" 기준을 표시 중)":"연결 중… (저장본을 임시로 표시)")
    :STATE.live?"실시간 ("+fmtAt(STATE.at)+" 기준)"
    :STATE.cached?"마지막으로 불러온 데이터("+fmtAt(STATE.at)+" 기준 · 연결 오류: "+STATE.err+")"
    :"저장본("+SNAP_DATE+" 기준 · 연결 오류: "+STATE.err+")";
  meta.textContent="데이터: "+lab+(!PENDING&&!STATE.live?" — 연결하지 못해 이전 값을 표시 중이며, 시트가 바뀌어도 갱신되지 않습니다.":"");
}
function load(){
  PENDING=true;paint();
  get(CONFIG.url,ALL_SNAPSHOT).then(r=>{STATE=r;PENDING=false;paint()});
}
document.getElementById("reload").onclick=load;
load();
</script>
